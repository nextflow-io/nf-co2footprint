name: "CITATION.cff validation"
on:
  push:
    paths:
      - CITATION.cff
  pull_request:
    paths:
      - CITATION.cff
  workflow_dispatch:

jobs:
  Validate-CITATION-cff:
    runs-on: ubuntu-latest
    name: Validate CITATION.cff
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4

      - name: Validate CITATION.cff
        uses: dieghernan/cff-validator@114aae53e1850c3757733beb60036941900e3dc3 # ratchet:dieghernan/cff-validator@v4
