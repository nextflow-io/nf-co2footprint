name: build docs
on:
  push:
    branches:
      - master
      - main
  # NOTE: a manual run deploys gh-pages from whichever ref is selected.
  # Use it from a fork to test changes without touching upstream.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      # escape: Dependabot does not bump action inputs. This exact uv version is
      # bumped by hand alongside docs/pyproject.toml's `required-version` floor.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      # --locked fails the job instead of silently re-resolving docs/uv.lock.
      - run: uv run --project docs --locked mkdocs gh-deploy --force
