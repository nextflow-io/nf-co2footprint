version: 2
updates:
  # Workflow actions. Gradle bumps touch plugin runtime deps and get their own decision.
  - package-ecosystem: "github-actions"
    directory: "/"
    # Dependabot reads this file from the default branch (master) only, but scans
    # and targets `dev`, which is where workflow changes land.
    target-branch: "dev"
    schedule:
      interval: "quarterly"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "🛰️ continuous integration"
    groups:
      all-actions:
        patterns:
          - "*"

  # Docs tooling used by build-docs.yml (docs/pyproject.toml + docs/uv.lock).
  - package-ecosystem: "uv"
    directory: "/docs"
    target-branch: "dev"
    schedule:
      interval: "quarterly"
    commit-message:
      prefix: "chore(docs)"
    labels:
      - "📝 documentation"
    groups:
      docs-tooling:
        patterns:
          - "*"
